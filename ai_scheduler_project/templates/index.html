<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Process Scheduler</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <!-- Background Elements -->
  <div class="bg-shape shape-1"></div>
  <div class="bg-shape shape-2"></div>

  <div class="container py-5 main-container">
    <header class="text-center mb-5 fade-in-up">
      <h1 class="display-4 fw-bold text-gradient mb-2">AI Process Scheduler</h1>
      <p class="text-muted-light fs-5">Advanced CPU scheduling optimization powered by Machine Learning</p>
    </header>

    <div class="row g-4">
      <!-- Case 1: Basic Scheduler -->
      <div class="col-xl-5 fade-in-up" style="animation-delay: 0.1s;">
        <div class="glass-card h-100" id="case1">
          <div class="card-header-custom">
            <h3 class="h5 mb-0 fw-bold"><i class="bi bi-cpu me-2 text-primary"></i>Basic Scheduler</h3>
            <span class="badge bg-primary rounded-pill">Standard</span>
          </div>
          
          <div class="card-body-custom">
            <form id="scheduler-form-case1" class="d-flex flex-column h-100">
              <div class="table-responsive mb-3 rounded-3 border-custom flex-grow-1">
                <table class="table table-hover table-custom mb-0" id="process-table-case1">
                  <thead>
                    <tr>
                      <th>PID</th>
                      <th>Arrival Time</th>
                      <th>Burst Time</th>
                    </tr>
                  </thead>
                  <tbody id="process-body-case1"></tbody>
                </table>
              </div>

              <div class="d-flex gap-2 mb-4">
                <button type="button" class="btn btn-action btn-add flex-grow-1" onclick="addProcess('case1')" title="Add Process">
                  <i class="bi bi-plus-lg"></i> Add
                </button>
                <button type="button" class="btn btn-action btn-delete flex-grow-1" onclick="deleteLast('case1')" title="Delete Last">
                  <i class="bi bi-trash"></i> Delete
                </button>
                <button type="button" class="btn btn-action btn-clear flex-grow-1" onclick="clearAll('case1')" title="Clear All">
                  <i class="bi bi-x-octagon"></i> Clear
                </button>
              </div>

              <div class="form-group mb-3">
                <label for="algorithm-case1" class="form-label text-light-custom">Algorithm</label>
                <select class="form-select custom-select" id="algorithm-case1">
                  <option value="fcfs">First Come First Serve (FCFS)</option>
                  <option value="sjf">Shortest Job First (SJF)</option>
                  <option value="round_robin">Round Robin (RR)</option>
                </select>
              </div>

              <div class="form-group mb-4" id="quantum-div-case1" style="display: none">
                <label for="quantum-case1" class="form-label text-light-custom">Quantum Time</label>
                <input type="number" class="form-control custom-input" id="quantum-case1" value="4" min="1" />
              </div>

              <button type="submit" class="btn btn-run w-100 btn-lg mt-auto">
                <i class="bi bi-play-fill me-1"></i> Run Scheduler
              </button>
            </form>

            <div id="output-case1" class="mt-4"></div>
          </div>
        </div>
      </div>

      <!-- Case 2: AI Scheduler -->
      <div class="col-xl-7 fade-in-up" style="animation-delay: 0.2s;">
        <div class="glass-card h-100" id="case2">
          <div class="card-header-custom">
            <h3 class="h5 mb-0 fw-bold"><i class="bi bi-robot me-2 text-info"></i>AI-Powered Scheduler</h3>
            <span class="badge bg-info text-dark rounded-pill">Smart Prediction</span>
          </div>
          
          <div class="card-body-custom">
            <form id="scheduler-form-case2" class="d-flex flex-column h-100">
              <div class="table-responsive mb-3 rounded-3 border-custom flex-grow-1">
                <table class="table table-hover table-custom mb-0" id="process-table-case2">
                  <thead>
                    <tr>
                      <th title="Process ID">PID</th>
                      <th title="Arrival Time">AT</th>
                      <th title="IO Write Bytes">IOWB</th>
                      <th title="Context Switches (Voluntary)">CSw</th>
                      <th title="CPU Percent">CPU%</th>
                      <th title="IO Read Bytes">IORB</th>
                      <th title="IO Read Count">IORC</th>
                      <th title="IO Write Count">IOWC</th>
                    </tr>
                  </thead>
                  <tbody id="process-body-case2"></tbody>
                </table>
              </div>

              <div class="d-flex gap-2 mb-4">
                <button type="button" class="btn btn-action btn-add flex-grow-1" onclick="addProcess('case2')" title="Add Process">
                  <i class="bi bi-plus-lg"></i> Add
                </button>
                <button type="button" class="btn btn-action btn-delete flex-grow-1" onclick="deleteLast('case2')" title="Delete Last">
                  <i class="bi bi-trash"></i> Delete
                </button>
                <button type="button" class="btn btn-action btn-clear flex-grow-1" onclick="clearAll('case2')" title="Clear All">
                  <i class="bi bi-x-octagon"></i> Clear
                </button>
              </div>

              <div class="form-group mb-4">
                <label for="algorithm-case2" class="form-label text-light-custom">Algorithm</label>
                <select class="form-select custom-select" id="algorithm-case2">
                  <option value="rl">Reinforcement Learning</option>
                </select>
              </div>

              <button type="submit" class="btn btn-run-ai w-100 btn-lg mt-auto">
                <i class="bi bi-lightning-charge-fill me-1"></i> Run AI Optimization
              </button>
            </form>

            <div id="output-case2" class="mt-4"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Shared variables
    let processCountCase1 = 0;
    let processCountCase2 = 0;

    // Toggle quantum input visibility for Case 1
    document.getElementById("algorithm-case1").addEventListener("change", function() {
      const quantumDiv = document.getElementById("quantum-div-case1");
      if (this.value === "round_robin") {
        quantumDiv.style.display = "block";
        quantumDiv.classList.add("fade-in-up");
      } else {
        quantumDiv.style.display = "none";
        quantumDiv.classList.remove("fade-in-up");
      }
    });

    function addProcess(caseType) {
      const tbody = document.getElementById(`process-body-${caseType}`);
      const row = document.createElement("tr");
      row.className = "fade-in-row";
      
      if (caseType === "case1") {
        row.innerHTML = `
          <td><span class="pid-badge">P${processCountCase1 + 1}</span></td>
          <td><input type="number" class="form-control custom-input form-control-sm" name="arrival_time" required min="0"></td>
          <td><input type="number" class="form-control custom-input form-control-sm" name="burst_time" required min="1"></td>
        `;
        processCountCase1++;
      } else {
        row.innerHTML = `
          <td><span class="pid-badge">P${processCountCase2 + 1}</span></td>
          <td><input type="number" class="form-control custom-input form-control-sm" name="arrival_time" required min="0"></td>
          <td><input type="number" class="form-control custom-input form-control-sm" name="io_write_bytes" required min="0"></td>
          <td><input type="number" class="form-control custom-input form-control-sm" name="num_ctx_switches_voluntary" required min="0"></td>
          <td><input type="number" class="form-control custom-input form-control-sm" name="cpu_percent" step="0.01" required min="0" max="100"></td>
          <td><input type="number" class="form-control custom-input form-control-sm" name="io_read_bytes" required min="0"></td>
          <td><input type="number" class="form-control custom-input form-control-sm" name="io_read_count" required min="0"></td>
          <td><input type="number" class="form-control custom-input form-control-sm" name="io_write_count" required min="0"></td>
        `;
        processCountCase2++;
      }
      tbody.appendChild(row);
      
      // Auto-scroll to bottom of table if needed
      tbody.parentElement.parentElement.scrollTop = tbody.parentElement.parentElement.scrollHeight;
    }

    function deleteLast(caseType) {
      const tbody = document.getElementById(`process-body-${caseType}`);
      if (tbody.lastChild) {
        const row = tbody.lastChild;
        row.style.animation = "fadeOutRow 0.3s forwards";
        setTimeout(() => {
          if (tbody.contains(row)) {
            tbody.removeChild(row);
            if (caseType === "case1") {
              processCountCase1--;
            } else {
              processCountCase2--;
            }
          }
        }, 250);
      }
    }

    function clearAll(caseType) {
      const tbody = document.getElementById(`process-body-${caseType}`);
      Array.from(tbody.children).forEach(row => {
        row.style.animation = "fadeOutRow 0.3s forwards";
      });
      setTimeout(() => {
        tbody.innerHTML = "";
        if (caseType === "case1") {
          processCountCase1 = 0;
        } else {
          processCountCase2 = 0;
        }
      }, 250);
    }

    function gatherProcessData(caseType) {
      const rows = document.querySelectorAll(`#process-body-${caseType} tr`);
      const processes = [];
      rows.forEach((row, index) => {
        const inputs = row.querySelectorAll("input");
        const values = Array.from(inputs).map(input => parseFloat(input.value));
        if (caseType === "case1") {
          processes.push({
            pid: `P${index + 1}`,
            arrival_time: values[0],
            burst_time: values[1],
          });
        } else {
          processes.push({
            pid: `P${index + 1}`,
            arrival_time: values[0],
            io_write_bytes: values[1],
            num_ctx_switches_voluntary: values[2],
            cpu_percent: values[3],
            io_read_bytes: values[4],
            io_read_count: values[5],
            io_write_count: values[6],
          });
        }
      });
      return processes;
    }

    // Case 1 Form Submit
    document.getElementById("scheduler-form-case1").addEventListener("submit", function(e) {
      e.preventDefault();
      const outputDiv = document.getElementById("output-case1");
      const processes = gatherProcessData("case1");

      if (processes.length === 0) {
        outputDiv.innerHTML = "<div class='alert alert-warning fade-in-up'><i class='bi bi-exclamation-triangle-fill me-2'></i>Please add at least one process before running the scheduler.</div>";
        return;
      }

      const algorithm = document.getElementById("algorithm-case1").value;
      const quantum = document.getElementById("quantum-case1")?.value || 4;
      
      // Loading State
      const btn = this.querySelector('button[type="submit"]');
      const originalHtml = btn.innerHTML;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Computing...';
      btn.disabled = true;

      // Simulate a small delay for smooth UI feedback
      setTimeout(() => {
        let result;
        if (algorithm === "fcfs") {
          result = fcfs(processes);
        } else if (algorithm === "sjf") {
          result = sjf(processes);
        } else if (algorithm === "round_robin") {
          result = roundRobin(processes, parseFloat(quantum));
        }
        
        displayOutput(result, "case1");
        btn.innerHTML = originalHtml;
        btn.disabled = false;
      }, 500);
    });

    // Case 2 Form Submit (API Call)
    document.getElementById("scheduler-form-case2").addEventListener("submit", async function(e) {
      e.preventDefault();
      const outputDiv = document.getElementById("output-case2");
      const processes = gatherProcessData("case2");

      if (processes.length === 0) {
        outputDiv.innerHTML = "<div class='alert alert-warning fade-in-up'><i class='bi bi-exclamation-triangle-fill me-2'></i>Please add at least one process before running the scheduler.</div>";
        return;
      }

      const algorithm = document.getElementById("algorithm-case2").value;
      
      const btn = this.querySelector('button[type="submit"]');
      const originalHtml = btn.innerHTML;
      btn.innerHTML = '<span class="spinner-grow spinner-grow-sm me-2" role="status" aria-hidden="true"></span>AI Analyzing...';
      btn.disabled = true;

      try {
        const res = await fetch("/schedule", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ processes, algorithm }),
        });
        
        if (!res.ok) throw new Error(`Server returned ${res.status}`);
        const data = await res.json();
        
        if (data.error) throw new Error(data.error);

        displayOutput(data, "case2");
      } catch(err) {
        outputDiv.innerHTML = `<div class='alert alert-danger fade-in-up'><i class='bi bi-x-circle-fill me-2'></i>Error: ${err.message}</div>`;
      } finally {
        btn.innerHTML = originalHtml;
        btn.disabled = false;
      }
    });

    function displayOutput(data, caseType) {
      const outputDiv = document.getElementById(`output-${caseType}`);
      
      if (!data.schedule || data.schedule.length === 0) {
        outputDiv.innerHTML = "<div class='alert alert-danger fade-in-up'><i class='bi bi-x-circle-fill me-2'></i>No valid output received from scheduler.</div>";
        return;
      }

      let tableHTML = `
        <div class="result-container fade-in-up mt-4">
          <h4 class="mb-3 text-gradient h5 fw-bold"><i class="bi bi-list-task me-2"></i>Execution Schedule</h4>
          <div class="table-responsive mb-4 border-custom rounded-3">
            <table class="table table-hover table-custom mb-0 text-center">
              <thead>
                <tr>
                  <th>PID</th>
                  <th title="Arrival Time">AT</th>
                  <th title="Burst Time">BT</th>
                  <th title="Completion Time">CT</th>
                  <th title="Turnaround Time">TAT</th>
                  <th title="Waiting Time">WT</th>
                </tr>
              </thead>
              <tbody>
      `;

      data.schedule.forEach(proc => {
        const bt = Number(proc.burst_time || 0).toFixed(2);
        const ct = Number(proc.completion_time || 0).toFixed(2);
        const tat = Number(proc.turnaround_time || 0).toFixed(2);
        const wt = Number(proc.waiting_time || 0).toFixed(2);
        
        tableHTML += `
          <tr>
            <td><span class="pid-badge">${proc.pid}</span></td>
            <td>${proc.arrival_time}</td>
            <td>${bt}</td>
            <td>${ct}</td>
            <td class="text-info fw-bold">${tat}</td>
            <td class="text-warning fw-bold">${wt}</td>
          </tr>
        `;
      });

      tableHTML += `
              </tbody>
            </table>
          </div>
          
          <h4 class="mb-3 text-gradient h5 fw-bold"><i class="bi bi-speedometer2 me-2"></i>Performance Metrics</h4>
          <div class="row g-3">
            <div class="col-6 col-md-4">
              <div class="metric-card">
                <div class="metric-title">Avg Waiting</div>
                <div class="metric-value text-warning">${Number(data.avg_waiting_time || 0).toFixed(2)}s</div>
              </div>
            </div>
            <div class="col-6 col-md-4">
              <div class="metric-card">
                <div class="metric-title">Avg Turnaround</div>
                <div class="metric-value text-info">${Number(data.avg_turnaround_time || 0).toFixed(2)}s</div>
              </div>
            </div>
            <div class="col-12 col-md-4">
              <div class="metric-card">
                <div class="metric-title">Avg Completion</div>
                <div class="metric-value text-success">${Number(data.avg_completion_time || 0).toFixed(2)}s</div>
              </div>
            </div>
      `;

      if (data.throughput !== undefined) {
        tableHTML += `
            <div class="col-6">
              <div class="metric-card">
                <div class="metric-title">Throughput</div>
                <div class="metric-value">${Number(data.throughput).toFixed(2)} <span class="fs-6 fw-normal">proc/s</span></div>
              </div>
            </div>
        `;
      }
      
      if (data.cpu_utilization !== undefined) {
        tableHTML += `
            <div class="col-6">
              <div class="metric-card">
                <div class="metric-title">CPU Util.</div>
                <div class="metric-value">${Number(data.cpu_utilization).toFixed(1)}%</div>
              </div>
            </div>
        `;
      }

      tableHTML += `
          </div>
        </div>
      `;

      outputDiv.innerHTML = tableHTML;
      
      // Smooth scroll to results
      setTimeout(() => {
        outputDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }, 100);
    }

    // --- Core Algorithms (Logic Unchanged from original) ---
    
    function fcfs(processes) {
      // Sort by arrival time
      processes.sort((a, b) => a.arrival_time - b.arrival_time);

      let time = 0;
      let avg_waiting_time = 0;
      let avg_turnaround_time = 0;
      let total_burst_time = 0;

      processes.forEach((process) => {
        // Advance clock if CPU is idle
        if (time < process.arrival_time) time = process.arrival_time;

        process.completion_time = time + process.burst_time;
        process.turnaround_time = Math.max(0, process.completion_time - process.arrival_time);
        process.waiting_time = Math.max(0, process.turnaround_time - process.burst_time);

        avg_waiting_time += process.waiting_time;
        avg_turnaround_time += process.turnaround_time;
        total_burst_time += process.burst_time;

        time = process.completion_time;
      });

      const total_processes = processes.length;
      const throughput = total_processes / time;
      const cpu_utilization = (total_burst_time / time) * 100;

      return {
        schedule: processes,
        avg_waiting_time: (avg_waiting_time / total_processes).toFixed(2),
        avg_turnaround_time: (avg_turnaround_time / total_processes).toFixed(2),
        avg_completion_time: (total_burst_time / total_processes).toFixed(2),
        throughput: throughput.toFixed(2),
        cpu_utilization: cpu_utilization.toFixed(2),
      };
    }

    function sjf(processes) {
      // Non-preemptive SJF: pick shortest available job at each step
      let remaining = [...processes];
      let time = 0;
      let scheduled = [];
      let avg_waiting_time = 0;
      let avg_turnaround_time = 0;
      let total_burst_time = 0;

      while (remaining.length > 0) {
        // Processes that have arrived by current time
        const available = remaining.filter(p => p.arrival_time <= time);

        let proc;
        if (available.length === 0) {
          // CPU idle — jump to next arrival
          time = Math.min(...remaining.map(p => p.arrival_time));
          continue;
        } else {
          // Pick shortest burst among arrived processes
          proc = available.reduce((a, b) => a.burst_time <= b.burst_time ? a : b);
        }

        remaining.splice(remaining.indexOf(proc), 1);

        proc.completion_time = time + proc.burst_time;
        proc.turnaround_time = Math.max(0, proc.completion_time - proc.arrival_time);
        proc.waiting_time = Math.max(0, proc.turnaround_time - proc.burst_time);

        avg_waiting_time += proc.waiting_time;
        avg_turnaround_time += proc.turnaround_time;
        total_burst_time += proc.burst_time;

        time = proc.completion_time;
        scheduled.push(proc);
      }

      const total_processes = scheduled.length;
      const throughput = total_processes / time;
      const cpu_utilization = (total_burst_time / time) * 100;

      return {
        schedule: scheduled,
        avg_waiting_time: (avg_waiting_time / total_processes).toFixed(2),
        avg_turnaround_time: (avg_turnaround_time / total_processes).toFixed(2),
        avg_completion_time: (total_burst_time / total_processes).toFixed(2),
        throughput: throughput.toFixed(2),
        cpu_utilization: cpu_utilization.toFixed(2),
      };
    }

    function roundRobin(processes, quantum) {
      // Sort by arrival time first
      const sorted = [...processes].sort((a, b) => a.arrival_time - b.arrival_time);

      let time = 0;
      let avg_waiting_time = 0;
      let avg_turnaround_time = 0;
      let total_burst_time = 0;

      // Track remaining burst times by index
      const remaining = sorted.map(p => ({ proc: p, rem: p.burst_time }));
      const readyQueue = [];
      let i = 0; // pointer into sorted arrivals

      // Seed with first arrival
      if (remaining.length > 0) {
        time = sorted[0].arrival_time;
        while (i < remaining.length && remaining[i].proc.arrival_time <= time) {
          readyQueue.push(remaining[i++]);
        }
      }

      while (readyQueue.length > 0) {
        const item = readyQueue.shift();
        const proc = item.proc;
        const slice = Math.min(item.rem, quantum);

        time += slice;
        item.rem -= slice;

        // Enqueue any newly arrived processes
        while (i < remaining.length && remaining[i].proc.arrival_time <= time) {
          readyQueue.push(remaining[i++]);
        }

        if (item.rem > 0) {
          // Not finished — re-queue
          readyQueue.push(item);
        } else {
          // Finished
          proc.completion_time = time;
          proc.turnaround_time = Math.max(0, proc.completion_time - proc.arrival_time);
          proc.waiting_time = Math.max(0, proc.turnaround_time - proc.burst_time);

          avg_waiting_time += proc.waiting_time;
          avg_turnaround_time += proc.turnaround_time;
          total_burst_time += proc.burst_time;
        }

        // If ready queue is empty but more processes haven't arrived yet
        if (readyQueue.length === 0 && i < remaining.length) {
          time = remaining[i].proc.arrival_time;
          while (i < remaining.length && remaining[i].proc.arrival_time <= time) {
            readyQueue.push(remaining[i++]);
          }
        }
      }

      const total_processes = sorted.length;
      const throughput = total_processes / time;
      const cpu_utilization = (total_burst_time / time) * 100;

      return {
        schedule: sorted,
        avg_waiting_time: (avg_waiting_time / total_processes).toFixed(2),
        avg_turnaround_time: (avg_turnaround_time / total_processes).toFixed(2),
        avg_completion_time: (total_burst_time / total_processes).toFixed(2),
        throughput: throughput.toFixed(2),
        cpu_utilization: cpu_utilization.toFixed(2),
      };
    }
  </script>
</body>
</html>
